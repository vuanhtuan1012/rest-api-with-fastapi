[project]
name = "social-media-api"
version = "1.0.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn",
]


[tool.black]
line-length = 100


[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]


[tool.pytest.ini_options]
testpaths = ["tests"]